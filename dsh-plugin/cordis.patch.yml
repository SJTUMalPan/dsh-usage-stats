# dsh-plugin bundle patch（package.json 的 dsh.bundle.patch 指向本文件）
#
# 本插件作为一个「profile 层级」被装载的全部声明：一行 insert。
#
# 安装（与其它本地插件一致，不需要手改 profile 的任何文件）：
#
#   dsh plugin --profile web add link:/workspace/deepseek_workspace/dsh-usage-stats/dsh-plugin
#
# `dsh plugin` 会把包交给 pnpm 装进 profile，然后**对账** `dsh.profile.bundles`：
# 只要包装了 dsh.bundle.patch，就把它的包名追加进层级列表。装完重启 `dsh web` 生效。
#
# 配置项（都可不写）：
#
#   - insert:
#       - id: usage-dashboard
#         name: dsh-usage-dashboard
#         config:
#           path: /usage                     # 挂载路径，默认 /usage
#           reportPath: /abs/path/report.html # 报表文件，默认 <本包>/../../usage-dashboard.html
#
- insert:
    - id: usage-dashboard
      name: dsh-usage-dashboard
